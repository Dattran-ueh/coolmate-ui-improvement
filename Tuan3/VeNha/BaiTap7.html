<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 7 - Bố cục trang</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px; font-family: Arial, sans-serif; }
    .wrapper-label { width: min(360px, 100%); margin: 0 auto 4px; font-size: 20px; }
    #wrapper { width: min(360px, 100%); margin: 0 auto; padding: 7px; border: 2px solid #111; display: grid; grid-template-columns: 64px 1fr; grid-template-areas: "header header" "nav main" "footer footer"; gap: 6px; box-shadow: -12px 12px 18px rgba(0, 0, 0, .24); }
    header, nav, main, footer { border: 2px solid #111; padding: 6px; font-size: 20px; }
    header { grid-area: header; height: 56px; }
    nav { grid-area: nav; min-height: 260px; }
    main { grid-area: main; min-height: 260px; }
    footer { grid-area: footer; min-height: 40px; }
  </style>
</head>
<body>
  <p class="wrapper-label">wrapper</p>
  <div id="wrapper">
    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <footer>footer</footer>
  </div>
</body>
</html>
