<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khoa CNTTKD</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333333;
    }

    /* Căn giữa toàn bộ nội dung */
    .best-shared {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
    }

    /* Logo */
    .logo {
      margin: 0 0 20px;
    }

    .logo img {
      width: 200px;
      max-width: 100%;
      height: auto;
    }

    /* Tiêu đề */
    .best-shared h2 {
      margin: 0 0 24px;
      font-size: 48px;
      font-weight: normal;
    }

    .best-shared h2 strong {
      color: #00aeef;
    }

    /* Đoạn giới thiệu */
    .lead-text {
      margin: 0 0 38px;
      font-size: 16px;
      line-height: 1.6;
    }

    /* Danh sách nút */
    .btn-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .btn-list li {
      display: inline-block;
      margin: 0 12px 12px;
    }

    .btn-list a {
      display: inline-block;
      min-width: 130px;
      padding: 20px 24px;
      border-radius: 4px;
      background-color: #2d3032;
      color: white;
      text-decoration: none;
    }

    .btn-list a:hover {
      background-color: #00aeef;
    }

    /* Điều chỉnh chữ trên điện thoại */
    @media (max-width: 600px) {
      .best-shared h2 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <section class="best-shared">
    <p class="logo">
      <img
        src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
        alt="Logo UEH và Khoa Công nghệ Thông tin Kinh doanh"
      >
    </p>

    <h2>Best <strong>Shared Hosting</strong> Company</h2>

    <p class="lead-text">
      With this responsive landing page template, you can promote your all
      hosting, domain and email services.
    </p>

    <ul class="btn-list">
      <li><a href="./">View Plans</a></li>
      <li><a href="./">All Features</a></li>
    </ul>
  </section>
</body>
</html>
