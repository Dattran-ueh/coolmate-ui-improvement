<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học web chuẩn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333333;
      background-color: #ffffff;
    }

    /* Khung chứa bài portfolio */
    .portfolio {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Tiêu đề */
    .portfolio h2 {
      margin: 0;
      text-align: center;
      font-size: 36px;
      color: #111111;
    }

    /* Đường gạch màu xanh dưới tiêu đề */
    .portfolio h2::after {
      content: "";
      display: block;
      width: 70px;
      height: 3px;
      margin: 18px auto 0;
      background-color: #44aaa8;
    }

    /* Danh sách các mục menu */
    .list-tab {
      margin: 30px 0 40px;
      padding: 0;
      list-style: none;
      text-align: center;
    }

    .list-tab li {
      display: inline-block;
      margin: 8px 12px;
    }

    .list-tab a {
      color: #555555;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    /* Tô màu mục All giống hình mẫu */
    .list-tab li:first-child a {
      color: #44aaa8;
    }

    .list-tab a:hover {
      color: #44aaa8;
    }

    /* Danh sách hình ảnh: 3 cột */
    .galerry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .galerry img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Màn hình máy tính bảng: 2 cột */
    @media (max-width: 768px) {
      .galerry {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Màn hình điện thoại: 1 cột */
    @media (max-width: 480px) {
      .portfolio {
        padding: 30px 16px;
      }

      .portfolio h2 {
        font-size: 28px;
      }

      .list-tab li {
        margin: 8px;
      }

      .galerry {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
